name: Drift

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download latest FFmpeg release
        run: |
          set -euo pipefail
          base="https://ffmpeg.martin-riedl.de/redirect/latest/linux/amd64/release"
          mkdir -p tools/bin .cache
          for name in ffmpeg ffprobe; do
            curl -fsSL "$base/$name.zip" -o "tools/bin/$name.zip"
            unzip -oq "tools/bin/$name.zip" -d tools/bin
            chmod +x "tools/bin/$name"
            rm -f "tools/bin/$name.zip"
          done
          (cd tools/bin && sha256sum ffmpeg ffprobe > CHECKSUMS)

      - name: Regenerate cache and spec
        run: |
          set -euo pipefail
          ./tools/bin/ffmpeg -h long > .cache/ffmpeg-help.txt
          ./tools/bin/ffmpeg -filters > .cache/ffmpeg-filters.txt
          ./tools/bin/ffmpeg -encoders > .cache/ffmpeg-encoders.txt
          ./tools/bin/ffmpeg -decoders > .cache/ffmpeg-decoders.txt
          ./tools/bin/ffmpeg -muxers > .cache/ffmpeg-muxers.txt
          ./tools/bin/ffmpeg -demuxers > .cache/ffmpeg-demuxers.txt
          ./tools/bin/ffmpeg -protocols > .cache/ffmpeg-protocols.txt
          ./tools/bin/ffmpeg -hwaccels > .cache/ffmpeg-hwaccels.txt
          ./tools/bin/ffmpeg -pix_fmts > .cache/ffmpeg-pix_fmts.txt
          ./tools/bin/ffmpeg -sample_fmts > .cache/ffmpeg-sample_fmts.txt
          ./tools/bin/ffmpeg -version > .cache/ffmpeg-version.txt
          node tools/spec-compiler/generate.mjs

      - name: Update coverage counts in REFERENCE
        run: |
          node --input-type=module -e '
          import { readFileSync, writeFileSync, existsSync } from "node:fs";
          import { resolve } from "node:path";
          const root = process.cwd();
          const refPath = resolve(root, "docs/REFERENCE.md");
          if (!existsSync(refPath)) process.exit(0);
          const specDir = resolve(root, "src/spec");
          const read = (f) => JSON.parse(readFileSync(resolve(specDir, f), "utf8"));
          const options = read("options.json");
          const filters = read("filters.json");
          const encoders = read("encoders.json");
          const muxers = read("muxers.json");
          const hwaccels = read("hwaccels.json");
          const filterDetails = read("filter-details.json").filters;
          const encoderDetails = read("encoder-details.json").encoders;
          const streamSpecs = read("stream-specs.json");
          const optionDetails = read("option-details.json").options;
          const counts = {
            options: options.options.length,
            filters: filters.length,
            encoders: encoders.length,
            muxers: muxers.length,
            hwaccels: hwaccels.length,
            filterDetails: filterDetails.length,
            encoderDetails: encoderDetails.length,
            decoders: streamSpecs.decoders.length,
            demuxers: streamSpecs.demuxers.length,
            protocols: streamSpecs.protocols.length,
            pixelFormats: streamSpecs.pixelFormats.length,
            sampleFormats: streamSpecs.sampleFormats.length,
            optionDetails: optionDetails.length,
          };
          const text = readFileSync(refPath, "utf8");
          const updated = text.split("\n").map((line) => {
            const m = line.match(/^\|\s*([^|]+?)\s*\|\s*\d+\s*\|/);
            if (!m) return line;
            const key = m[1].trim();
            if (!(key in counts)) return line;
            return line.replace(/^(\|\s*[^|]+?\s*\|\s*)\d+(\s*\|)/, "$1" + counts[key] + "$2");
          }).join("\n");
          writeFileSync(refPath, updated);
          console.log("updated coverage counts in docs/REFERENCE.md");
          '

      - name: Run gate
        run: bun run ci

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/ffmpeg-spec-drift
          delete-branch: true
          title: 'chore(spec): update ffmpeg spec'
          commit-message: 'chore(spec): update ffmpeg spec'
          body: |
            Automated weekly FFmpeg drift check.

            This PR downloads the latest FFmpeg release, regenerates the spec, and runs the gate.
            Review the spec and cache changes before merging.
