name: TUI release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI
        run: bun run ci

      - name: Stamp release version
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            sed -i "s/0\\.0\\.0/$tag/g" src/tui/run.ts
          fi

      - name: Package Linux binaries
        run: bash scripts/package-tui.sh | tee dist/SHA256SUMS

      - name: Install QEMU for arm64 test
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Test x64 binary
        run: ./dist/ffmpeg-tui-linux-x64 --version

      - name: Test arm64 binary
        run: qemu-aarch64-static ./dist/ffmpeg-tui-linux-arm64 --version

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ffmpeg-tui-linux-x64
            dist/ffmpeg-tui-linux-arm64
            dist/SHA256SUMS
