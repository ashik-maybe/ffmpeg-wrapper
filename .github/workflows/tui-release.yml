name: TUI release

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI
        run: bun run ci

      - name: Package Linux binaries
        run: bash scripts/package-tui.sh | tee dist/SHA256SUMS

      - name: Install QEMU for arm64 test
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Test x64 binary
        run: ./dist/ffmpeg-tui-linux-x64 --version

      - name: Test arm64 binary
        run: qemu-aarch64-static ./dist/ffmpeg-tui-linux-arm64 --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-tui-linux
          path: |
            dist/ffmpeg-tui-linux-x64
            dist/ffmpeg-tui-linux-arm64
            dist/SHA256SUMS
